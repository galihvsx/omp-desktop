name: Bug report
description: Report a problem with OMP Desktop
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please fill in as much detail as you can — it makes triage much faster.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, and what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: The app version or commit hash you are running.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Windows version, and WebView2 version if known.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Relevant output from the app's terminal or console. Redact anything sensitive.
    validations:
      required: false
